name: Validate Skill

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Validate SKILL.md schema and references
        run: node scripts/validate-skill.mjs

      - name: Smoke-test npx skills discovery
        run: npx --yes skills add . --list
